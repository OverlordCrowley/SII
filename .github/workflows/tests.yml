name: Python checks

on: [push, pull_request]

jobs:
  cryptoscope:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    defaults:
      run:
        working-directory: crypto-project-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend.test.cjs
      - run: python -m unittest discover -s tests -v
      - run: python -m project_assistant demo
      - run: python -m project_assistant week56
      - run: python -m project_assistant week48
      - run: python -m project_assistant week415
